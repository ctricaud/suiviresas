<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propriétaires — Suivi Réservations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap');

  :root {
    --bg:       #0a0a0a;
    --bg2:      #111111;
    --gold:     #c9a84c;
    --gold-l:   #e8c96a;
    --gold-dim: rgba(201,168,76,0.10);
    --white:    #f0ece0;
    --grey:     #666;
    --border:   rgba(201,168,76,0.22);
    --row-alt:  rgba(255,255,255,0.02);
    --row-hov:  rgba(201,168,76,0.06);
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Nunito', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    padding: 20px 48px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .back-btn {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 1.1rem;
    letter-spacing: 3px;
    color: var(--gold);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 8px 20px;
    border-radius: 6px;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .back-btn:hover { background: var(--gold-dim); border-color: var(--gold); }

  .header-app {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 1rem;
    letter-spacing: 3px;
    color: var(--grey);
  }

  /* ── MAIN ── */
  main { flex: 1; padding: 48px 64px 64px; }

  .page-title {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(3rem, 5vw, 5rem);
    letter-spacing: 6px;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 6px;
  }

  .page-subtitle {
    font-size: 1rem;
    color: var(--grey);
    letter-spacing: 1px;
    margin-bottom: 40px;
  }

  /* ── STATS ── */
  .stats-bar { display: flex; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; }

  .stat-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 28px;
    text-align: center;
    min-width: 130px;
  }
  .stat-val {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 2.4rem;
    color: var(--gold);
    letter-spacing: 2px;
    line-height: 1;
  }
  .stat-lbl {
    font-size: 0.78rem;
    color: var(--grey);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── RECHERCHE ── */
  .search-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }

  .search-input {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'Nunito', Arial, sans-serif;
    font-size: 1rem;
    padding: 10px 18px;
    border-radius: 8px;
    outline: none;
    width: 320px;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: var(--grey); }
  .result-count { font-size: 0.9rem; color: var(--grey); margin-left: auto; }

  /* ── TABLEAU ── */
  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg2);
  }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    background: rgba(201,168,76,0.10);
    color: var(--gold);
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 1.3rem;
    letter-spacing: 2px;
    padding: 16px 24px;
    text-align: left;
    border-bottom: 2px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: background 0.15s;
  }
  thead th:hover { background: rgba(201,168,76,0.18); }
  thead th .si { margin-left: 6px; opacity: 0.35; font-size: 0.85rem; }
  thead th.sorted .si { opacity: 1; color: var(--gold-l); }

  tbody tr {
    border-bottom: 1px solid rgba(201,168,76,0.07);
    transition: background 0.12s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hov); }

  tbody td { padding: 14px 24px; font-size: 1.05rem; vertical-align: middle; }

  td.col-nom   { font-weight: 700; color: var(--white); }
  td.col-email { color: var(--grey); font-size: 0.9rem; }
  td.col-nb {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 1.6rem;
    color: var(--gold);
    text-align: center;
  }
  td.col-id { font-family: monospace; font-size: 0.72rem; color: #3a3a3a; }

  /* ── ÉTATS ── */
  .state {
    text-align: center;
    padding: 60px 24px;
    color: var(--grey);
    font-size: 1rem;
    letter-spacing: 2px;
    font-family: 'Bebas Neue', Impact, sans-serif;
  }
  .state.error { color: #e05555; }

  .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 3px solid rgba(201,168,76,0.15);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── FOOTER ── */
  footer { padding: 18px 48px; border-top: 1px solid rgba(201,168,76,0.1); }
  .footer-info {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 0.85rem;
    letter-spacing: 3px;
    color: #2a2a2a;
  }
</style>
</head>
<body>

<header>
  <a href="/" class="back-btn">← ACCUEIL</a>
  <span class="header-app">SUIVI RÉSERVATIONS</span>
</header>

<main>
  <h1 class="page-title">PROPRIÉTAIRES</h1>
  <p class="page-subtitle">Contacts · Portefeuille · Nombre de propriétés</p>

  <div class="stats-bar">
    <div class="stat-box">
      <div class="stat-val" id="stat-total">—</div>
      <div class="stat-lbl">Propriétaires</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="stat-listings">—</div>
      <div class="stat-lbl">Propriétés total</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="stat-sans">—</div>
      <div class="stat-lbl">Sans propriété</div>
    </div>
  </div>

  <div class="search-bar">
    <input class="search-input" type="text" id="search"
      placeholder="Rechercher un propriétaire…" oninput="filterAndRender()">
    <span class="result-count" id="result-count"></span>
  </div>

  <div class="table-wrap">
    <div class="state" id="state-loading">
      <div class="spinner"></div><br>CHARGEMENT DEPUIS GUESTY…
    </div>
    <table id="owners-table" style="display:none">
      <thead>
        <tr>
          <th onclick="sortBy('nom')"        id="th-nom">   NOM <span class="si">↕</span></th>
          <th onclick="sortBy('email')"       id="th-email"> EMAIL <span class="si">↕</span></th>
          <th onclick="sortBy('nb_listings')" id="th-nb" style="text-align:center">
            PROPRIÉTÉS <span class="si">↕</span>
          </th>
          <th>ID</th>
        </tr>
      </thead>
      <tbody id="owners-body"></tbody>
    </table>
    <div class="state error" id="state-error" style="display:none"></div>
  </div>
</main>

<footer>
  <span class="footer-info">BLACK6 · PORT 3010</span>
</footer>

<script>
  let allData = [];
  let sortCol = 'nom';
  let sortAsc = true;

  async function load() {
    try {
      const res  = await fetch('/api/owners');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur serveur');

      allData = data;
      document.getElementById('stat-total').textContent    = allData.length;
      document.getElementById('stat-listings').textContent = allData.reduce((s,o) => s + o.nb_listings, 0);
      document.getElementById('stat-sans').textContent     = allData.filter(o => o.nb_listings === 0).length;

      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('owners-table').style.display  = 'table';
      filterAndRender();
    } catch(e) {
      document.getElementById('state-loading').style.display = 'none';
      const el = document.getElementById('state-error');
      el.style.display = 'block';
      el.textContent   = '⚠ Erreur : ' + e.message;
    }
  }

  function filterAndRender() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    let data = allData.filter(o =>
      !q ||
      o.nom.toLowerCase().includes(q) ||
      o.email.toLowerCase().includes(q) ||
      o.id.toLowerCase().includes(q)
    );

    data.sort((a, b) => {
      let va = a[sortCol] ?? '', vb = b[sortCol] ?? '';
      if (typeof va === 'number') return sortAsc ? va - vb : vb - va;
      return sortAsc
        ? String(va).localeCompare(String(vb), 'fr')
        : String(vb).localeCompare(String(va), 'fr');
    });

    document.getElementById('result-count').textContent =
      `${data.length} propriétaire${data.length > 1 ? 's' : ''}`;

    document.getElementById('owners-body').innerHTML = data.map(o => `
      <tr>
        <td class="col-nom">${esc(o.nom)}</td>
        <td class="col-email">${esc(o.email)}</td>
        <td class="col-nb">${o.nb_listings || '—'}</td>
        <td class="col-id">${esc(o.id)}</td>
      </tr>
    `).join('');
  }

  function sortBy(col) {
    sortAsc = sortCol === col ? !sortAsc : true;
    sortCol = col;
    const map = { nom:'th-nom', email:'th-email', nb_listings:'th-nb' };
    Object.entries(map).forEach(([c, id]) => {
      const th   = document.getElementById(id);
      const icon = th.querySelector('.si');
      if (c === sortCol) {
        th.classList.add('sorted');
        icon.textContent = sortAsc ? '↑' : '↓';
      } else {
        th.classList.remove('sorted');
        icon.textContent = '↕';
      }
    });
    filterAndRender();
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  load();
</script>
</body>
</html>
