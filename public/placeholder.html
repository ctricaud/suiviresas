<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">— Suivi Réservations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bebas+Neue&display=swap');

  :root {
    --bg:     #000000;
    --bg2:    #0d0d0d;
    --gold:   #f0c040;
    --white:  #ffffff;
    --grey:   #999999;
    --border: rgba(240,192,64,0.30);
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Atkinson Hyperlegible', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    width: 100%;
    padding: 20px 40px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .back-btn {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 1.3rem;
    letter-spacing: 3px;
    color: var(--gold);
    text-decoration: none;
    border: 2px solid var(--border);
    padding: 10px 24px;
    border-radius: 6px;
    transition: background 0.15s, border-color 0.15s;
  }
  .back-btn:hover { background: rgba(240,192,64,0.10); border-color: var(--gold); }

  .header-app {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 1.1rem;
    letter-spacing: 3px;
    color: var(--grey);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px;
    text-align: center;
  }

  .page-title {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(3rem, 5vw, 5rem);
    letter-spacing: 6px;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 16px;
  }

  .en-construction {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 1.2rem;
    letter-spacing: 4px;
    color: var(--grey);
    border: 2px solid var(--border);
    padding: 12px 32px;
    border-radius: 8px;
    margin-top: 24px;
    display: inline-block;
  }

  footer {
    padding: 16px 40px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .footer-info {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 1rem;
    letter-spacing: 3px;
    color: var(--grey);
  }
</style>
</head>
<body>

<header>
  <a href="/" class="back-btn">← ACCUEIL</a>
  <span class="header-app">SUIVI RÉSERVATIONS</span>
</header>

<main>
  <h1 class="page-title" id="title-text">—</h1>
  <div class="en-construction">⚙ PAGE EN CONSTRUCTION</div>
</main>

<footer>
  <span class="footer-info">BLACK6 · PORT 3010</span>
</footer>

<script>
  const titres = {
    '/maj-reservations': 'MAJ RÉSERVATIONS',
    '/maj-listings':     'MAJ PROPRIÉTÉS',
    '/suivi-prises':     'SUIVI PRISE DE RÉSERVATION',
    '/listings':         'LISTE DES PROPRIÉTÉS',
    '/reservations':     'LISTE DES RÉSERVATIONS',
  };
  const titre = titres[window.location.pathname] || 'PAGE';
  document.getElementById('title-text').textContent = titre;
  document.getElementById('page-title').textContent = titre + ' — Suivi Réservations';
</script>

</body>
</html>
